name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.23.4 = the Docker image, 26 = current LTS
        node-version: ['22.23.4', '26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same build as docker.sh (the Dockerfile runs `yarn test` inside the image)
      - name: Build image
        run: docker build --platform linux/amd64 -t banner-generator .
      - name: Generate a banner in the container
        run: |
          docker run -d --name bg -p 127.0.0.1:3000:3000 banner-generator
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/banners/type-a && break; sleep 1; done
          curl -fsS -o out.jpg -w '%{http_code} %{content_type}\n' 'http://127.0.0.1:3000/banners/type-a?text0=Banner%20generator%20CI&bgColor=%23336699'
          file out.jpg | grep -q 'JPEG image data'
          docker logs bg | tail -20
